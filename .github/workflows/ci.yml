name: ✅ CI
run-name: ✅ CI on ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ✅ Typecheck
            task: typecheck
          - name: 🧹 Lint
            task: lint
          - name: 🪦 Dead code
            task: lint:dead
          - name: 🔁 Cycles
            task: lint:cycles
          - name: 🧪 Tests
            task: test
          - name: 📦 Build
            task: build

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: 🟢 Set Up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26.12.1

      - name: 🥟 Set Up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: 📦 Install Dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: ▶️ Run ${{ matrix.task }}
        env:
          TASK: ${{ matrix.task }}
        run: bun run "$TASK"
